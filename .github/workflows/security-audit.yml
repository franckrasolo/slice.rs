name: Security Audit
on:
  push:
    paths:
      - '.github/workflows/security-audit.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '0 7-17/5 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        name: Audit Rust Dependencies
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
